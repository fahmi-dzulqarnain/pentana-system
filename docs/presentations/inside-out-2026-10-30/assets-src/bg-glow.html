<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&display=swap" rel="stylesheet"><style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:radial-gradient(circle at 50% 120%, rgba(247,147,30,.38), transparent 55%), linear-gradient(130deg,#120d4a,#1b1464)}
.ring{position:absolute;border:3px solid rgba(247,147,30,.18);border-radius:50%;left:50%;transform:translateX(-50%)}
/* Static LIVE DEMO pill; the pulsing dot (live-dot.gif) is placed over the gap at x=814..878, y=268..332 (points). */
.pill{position:absolute;left:50%;top:260px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;
  padding:14px 34px 14px 120px;border-radius:999px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);
  font:800 30px 'Manrope',sans-serif;letter-spacing:.14em;color:#fff}
</style></head><body>
<div class="ring" style="width:1150px;height:1150px;top:430px"></div>
<div class="ring" style="width:1730px;height:1730px;top:270px"></div>
<div class="pill">LIVE DEMO</div>
</body></html>
