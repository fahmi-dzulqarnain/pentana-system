<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside Out Session</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>
<div id="viewport"><div id="stage"><div id="bg"></div></div></div>
<div id="presenter" hidden>
  <header><span id="p-clock">0:00</span><span id="p-plan"></span><span id="p-pos"></span></header>
  <main>
    <section class="p-now"><div class="p-label">Now</div><div class="p-frame" id="p-now"></div></section>
    <section class="p-next"><div class="p-label">Next</div><div class="p-frame" id="p-next"></div>
      <div class="p-keys">→ / Space next · ← back · B backups (on a demo slide) · Esc leave backups · 0-9 + Enter jump · R reset timer</div></section>
    <section class="p-notes"><div class="p-label" id="p-id"></div><div id="p-notes"></div></section>
  </main>
</div>
<div id="jump" hidden></div>
<script src="deck-data.js"></script>
<script src="deck.js"></script>
</body>
</html>
