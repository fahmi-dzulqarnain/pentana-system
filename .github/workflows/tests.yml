name: tests

# The server's auto-deploy (deploy/auto-deploy.sh) only ships a commit on main
# once the "tests" check below has passed for it. Renaming this job breaks that.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'          # matches the server; composer.lock needs >= 8.4
          extensions: pdo_sqlite, mbstring, intl, bcmath, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      # Before any artisan call: a service provider resolves a Vite asset at boot.
      - name: Build assets
        run: npm ci --no-audit --no-fund && npm run build

      - name: Prepare env
        run: cp .env.example .env && php artisan key:generate

      - name: Run tests
        run: php artisan test
