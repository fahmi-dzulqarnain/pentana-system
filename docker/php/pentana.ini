; Same limits as provision-server.sh: Android APK releases (up to 50 MB) are the largest upload.
upload_max_filesize = 64M
post_max_size = 65M
memory_limit = 256M

expose_php = Off

; The image is immutable, so PHP never needs to re-check files for changes.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
