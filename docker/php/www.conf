; Loaded after the image's www.conf. The container runs as www-data, so the user/group
; directives are not needed; listen on TCP so the nginx container can reach FPM.
[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
