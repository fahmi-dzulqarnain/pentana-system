sonar.projectKey=fahmi_pentana-system_7a175070-02ab-4b33-87dd-1259f91227bc
sonar.projectName=PENTANA System
sonar.qualitygate.wait=true

sonar.sources=app,routes,config,database,resources
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**
sonar.sourceEncoding=UTF-8

# resources/css/app.css is Tailwind v4: @source (like @theme) is real syntax there, but the CSS
# analyser only knows standard at-rules and reports each one as a bug. Ignore that one rule
# (css:S4662, unknown at-rules) in that one file.
sonar.issue.ignore.multicriteria=tailwind
sonar.issue.ignore.multicriteria.tailwind.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwind.resourceKey=resources/css/app.css
